<div class="login-container" role="main" aria-labelledby="login-heading">
  <div class="login-card">
    <div class="login-header">
      <h1 id="login-heading" class="login-title">WorkHub HRMS</h1>
      <p class="login-subtitle">Sign in to your account</p>
    </div>
    
    <div class="login-content">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
        <div class="form-field-container">
          <div class="form-group">
            <label for="email">Email</label>
            <input 
              id="email" 
              formControlName="email" 
              placeholder="Enter your email" 
              type="email" 
              class="form-control" 
              autocomplete="email"
              [attr.aria-invalid]="f['email'].invalid && f['email'].touched ? true : null"
              aria-describedby="email-error">
            
            <div id="email-error" *ngIf="f['email'].errors?.['required'] && (f['email'].dirty || f['email'].touched)" class="error-message" role="alert">
              Email is required
            </div>
            <div *ngIf="f['email'].errors?.['email'] && (f['email'].dirty || f['email'].touched)" class="error-message" role="alert">
              Please enter a valid email address
            </div>
          </div>
          
          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-field">
              <input 
                id="password" 
                formControlName="password" 
                [type]="hidePassword ? 'password' : 'text'" 
                class="form-control"
                placeholder="Enter your password"
                autocomplete="current-password"
                [attr.aria-invalid]="f['password'].invalid && f['password'].touched ? true : null"
                aria-describedby="password-error">
              
              <button 
                (click)="hidePassword = !hidePassword" 
                type="button" 
                class="password-toggle" 
                [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'"
                tabindex="0">
                {{ hidePassword ? 'Show' : 'Hide' }}
              </button>
            </div>
            <div id="password-error" *ngIf="f['password'].errors?.['required'] && (f['password'].dirty || f['password'].touched)" class="error-message" role="alert">
              Password is required
            </div>
          </div>
        </div>
        
        <div *ngIf="error" class="alert alert-danger" role="alert">{{error}}</div>
        
        <div class="form-actions">
          <button type="submit" [disabled]="loading || loginForm.invalid" class="login-button" aria-live="polite">
            <div *ngIf="loading" class="loader-container">
              <span class="loader"></span>
              <span class="loader-text">Signing in...</span>
            </div>
            <span *ngIf="!loading">Sign In</span>
          </button>
        </div>
      </form>
    </div>
    
    <div class="login-footer">
      <div class="login-links">
        <a routerLink="/auth/forgot-password" tabindex="0">Forgot Password?</a>
        <a routerLink="/auth/register" tabindex="0">Create an account</a>
      </div>
    </div>
  </div>
</div>
