<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2 class="login-title">WorkHub HRMS</h2>
      <p class="login-subtitle">Sign in to your account</p>
    </div>
    
    <div class="login-content">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-field-container">
          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" formControlName="email" placeholder="Email" type="email" class="form-control">
            <div *ngIf="f['email'].errors?.['required'] && (f['email'].dirty || f['email'].touched)" class="error-message">
              Email is required
            </div>
            <div *ngIf="f['email'].errors?.['email'] && (f['email'].dirty || f['email'].touched)" class="error-message">
              Please enter a valid email address
            </div>
          </div>
          
          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-field">
              <input id="password" formControlName="password" [type]="hidePassword ? 'password' : 'text'" class="form-control">
              <button (click)="hidePassword = !hidePassword" type="button" class="password-toggle">
                {{ hidePassword ? 'Show' : 'Hide' }}
              </button>
            </div>
            <div *ngIf="f['password'].errors?.['required'] && (f['password'].dirty || f['password'].touched)" class="error-message">
              Password is required
            </div>
          </div>
        </div>
        
        <div *ngIf="error" class="alert alert-danger mt-3">{{error}}</div>
        
        <div class="form-actions">
          <button type="submit" [disabled]="loading || loginForm.invalid" class="login-button">
            <span *ngIf="loading">Loading...</span>
            <span *ngIf="!loading">Sign In</span>
          </button>
        </div>
      </form>
    </div>
    
    <div class="login-footer">
      <div class="login-links">
        <a routerLink="/auth/forgot-password">Forgot Password?</a>
        <a routerLink="/auth/register">Create an account</a>
      </div>
    </div>
  </div>
</div>
